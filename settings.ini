[DEFAULT]
# All sections below are required unless otherwise specified.
# See https://github.com/AnswerDotAI/nbdev/blob/main/settings.ini for examples.

### Python library ###
repo = sslides
lib_name = %(repo)s
version = 0.0.14
min_python = 3.9
license = apache2
black_formatting = False

### nbdev ###
doc_path = _docs
lib_path = sslides
nbs_path = nbs
recursive = True
tst_flags = notest
put_version_in_init = True
update_pyproject = True

### Docs ###
branch = main
custom_sidebar = False
doc_host = https://%(user)s.github.io
doc_baseurl = /%(repo)s
git_url = https://github.com/%(user)s/%(repo)s
title = %(lib_name)s

### PyPI ###
audience = Developers
author = Solveit
author_email = nobody@fast.ai
copyright = 2026 onwards, %(author)s
description = Create awsome Solveit slides
keywords = nbdev jupyter notebook python
language = English
status = 3
user = rleyvasal

### Optional ###
requirements = fastcore python-fasthtml mistletoe pygments latex2mathml dialoghelper

# dev_requirements = 
# console_scripts =
# conda_user = 
package_data_dir = sslides
package_data = sslides/assets/*
